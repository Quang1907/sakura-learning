<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="220" fill="white" fill-opacity="0.6" />
  
  <!-- Sakura Flower Center -->
  <g transform="translate(256, 256)">
    <!-- 5 Petals -->
    <path d="M 0,-30 C -40,-120 -80,-160 0,-210 C 80,-160 40,-120 0,-30 Z" fill="url(#sakuraGrad)" />
    <path d="M 0,-30 C -40,-120 -80,-160 0,-210 C 80,-160 40,-120 0,-30 Z" fill="url(#sakuraGrad)" transform="rotate(72)" />
    <path d="M 0,-30 C -40,-120 -80,-160 0,-210 C 80,-160 40,-120 0,-30 Z" fill="url(#sakuraGrad)" transform="rotate(144)" />
    <path d="M 0,-30 C -40,-120 -80,-160 0,-210 C 80,-160 40,-120 0,-30 Z" fill="url(#sakuraGrad)" transform="rotate(216)" />
    <path d="M 0,-30 C -40,-120 -80,-160 0,-210 C 80,-160 40,-120 0,-30 Z" fill="url(#sakuraGrad)" transform="rotate(288)" />
    
    <!-- Flower Pistils -->
    <circle cx="0" cy="0" r="32" fill="#fda4af" />
    <circle cx="0" cy="0" r="18" fill="#e11d48" />
  </g>
  
  <!-- Subtle text or kanji in center: 桜 -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="900" text-anchor="middle" fill="#e11d48">SAKURA</text>
</svg>
